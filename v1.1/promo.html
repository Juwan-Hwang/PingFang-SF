const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const TXT5='「竖排」时，《书名》与标点各就各位。真的吗？是的！';

// ---------- S6 svg ----------
const NS='http://www.w3.org/2000/svg';

function setp(p,x,y,k,o=1,fill){p.setAttribute('transform',`translate(${x.toFixed(2)},${y.toFixed(2)}) scale(${k},${-k})`);p.setAttribute('opacity',C(o).toFixed(3));if(fill)p.setAttribute('fill',fill)}
function stext(svg,x,y,s,txt,fill='#a9a7a0',anchor='start',w=450){const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('font-size',s);t.setAttribute('fill',fill);t.setAttribute('text-anchor',anchor);t.style.fontVariationSettings=`'wght' ${w}`;t.style.fontVariantNumeric='tabular-nums';t.textContent=txt;svg.appendChild(t);return t}

  const s6=$('s6'); const pos=[[150,150],[990,150],[150,520],[990,520]];

  // A: kerning
  {const s=PANELS.p0.svg,k=.2,by=252;const A=GLY.AV_n500.glyphs,B=GLY.To_n500.glyphs;

   o.m1=document.createElementNS(NS,'rect');o.m2=document.createElementNS(NS,'rect');[o.m1,o.m2].forEach(m=>{m.setAttribute('fill',`rgba(${ACC},.85)`);m.setAttribute('height',150);m.setAttribute('y',by-150);s.insertBefore(m,s.firstChild)});

   const kb=.085,bx=360,bby=200;GLY.bism.glyphs.forEach(g=>{if(g.g=='space')return;o.bm.push({p:gpath(s,g,bx+g.x*kb,bby-g.y*kb,kb),g,mark:g.cls==3})});
   o.k=k;o.by=by;o.jx=jx;o.kb=kb;o.bx=bx;o.bby=bby;PANELS.p1.o=o;}
  // C: devanagari
  {const s=PANELS.p2.svg,k=.19,by=220;const o={};
   o.ka=gpath(s,GLY.ka.glyphs[0],0,by,k);o.vi=gpath(s,GLY.vir.glyphs[0],0,by,k);o.ss=gpath(s,GLY.ssa.glyphs[0],0,by,k);o.kssa=gpath(s,GLY.kssa.glyphs[0],0,by,k);
   o.p1=stext(s,0,by-55,64,'+','#77756f','middle',300);o.p2=stext(s,0,by-55,64,'+','#77756f','middle',300);

   const ax=A[0].adv*k,akx=Ak[0].adv*k,tx=T[0].adv*k,tkx=Tk[0].adv*k;
   const offA=(ax-akx)*p/2, offT=(tx-tkx)*p/2;
   setp(o.A0,70+offA,by,k);setp(o.A1,70+L(ax,akx,p)+offA,by,k);setp(o.T0,420+offT,by,k);setp(o.T1,420+L(tx,tkx,p)+offT,by,k);
   const m=(r,x,wd)=>{r.setAttribute('x',x.toFixed(1));r.setAttribute('width',Math.max(0,wd).toFixed(1));r.setAttribute('opacity',(.18+.25*p).toFixed(2))};
   m(o.m1,70+offA+L(ax,akx,p),(ax-akx)*p);m(o.m2,420+offT+L(tx,tkx,p),(tx-tkx)*p);
   o.m1.setAttribute('x',(70+offA+akx).toFixed(1));o.m2.setAttribute('x',(420+offT+tkx).toFixed(1));
   o.t1.textContent='AV  kern '+(p>0?MINUS:'')+Math.abs(kv(0,-63));o.t2.textContent='To  kern '+(p>0?MINUS:'')+Math.abs(kv(0,-96));
   o.t1.setAttribute('opacity',seg(tt,0.4,0.7));o.t2.setAttribute('opacity',seg(tt,0.4,0.7));}
  // B arabic
  {const o=PANELS.p1.o;const p=eio3(seg(tt,0.9,1.7)),q=seg(p,.55,1);
   o.iso.forEach(({p:pp,c})=>{const J=o.join.find(j=>j.cl==c);const jx=o.jx+J.g.x*o.k;const sx=o.jx+ (2-c)*120-20;setp(pp,L(sx,jx,p),o.by,o.k,1-q)});
   o.join.forEach(j=>{setp(j.p,o.jx+j.g.x*o.k,o.by,o.k,q,q>.0&&q<1?`rgb(255,${Math.round(L(170,242,q))},${Math.round(L(110,236,q))})`:'#f4f2ec')});
   let mi=0;o.bm.forEach(b=>{const x=o.bx+b.g.x*o.kb,y=o.bby-b.g.y*o.kb;if(!b.mark){setp(b.p,x,y,o.kb,seg(tt,0.9,1.3));return}
     const st=1.4+mi*0.13;mi++;const d=seg(tt,st,st+.5);const yy=y-(1-eback(d,2.2))*70;
     setp(b.p,x,yy,o.kb,seg(d,0,.3),d<1?`rgb(255,${Math.round(L(150,200,d))},90)`:'#ffb27a')});}
  // C devanagari
  {const o=PANELS.p2.o,k=o.k,by=o.by;const p=eio3(seg(tt,1.25,2.0)),q=seg(tt,1.95,2.25);
   const ka=GLY.ka.width*k, ss=GLY.ssa.width*k, lig=GLY.kssa.width*k;
   const fx0=390-lig/2; // final origin
   const spread=[[110,0],[330,0],[480,0]];
   // assembled targets: ka at fx0, virama attached after ka, ssa after ka
   const tKa=fx0-(ka+ss-lig)/2, tVi=tKa+ka, tSs=tKa+ka;
   const xKa=L(spread[0][0]-ka/2,tKa,p),xVi=L(spread[1][0],tVi,p),xSs=L(spread[2][0]+40,tSs,p);
   const ap=seg(tt,1.0,1.3);
   setp(o.ka,xKa,by,k,ap*(1-q));setp(o.vi,xVi,by,k,ap*(1-q),'#ffb27a');setp(o.ss,xSs,by,k,ap*(1-q));
   o.p1.setAttribute('x',(xKa+ka+xVi)/2-20);o.p2.setAttribute('x',(xVi+xSs)/2+10);o.p1.setAttribute('opacity',ap*(1-p));o.p2.setAttribute('opacity',ap*(1-p));
   const fl=Math.exp(-Math.pow((tt-2.12)/0.12,2));
   setp(o.kssa,fx0,by,k,q,`rgb(255,${Math.round(L(242,175,fl))},${Math.round(L(236,120,fl))})`);
   o.kssa.style.filter=`drop-shadow(0 0 ${(6+24*fl).toFixed(0)}px rgba(${ACC},${(.3+.6*fl).toFixed(2)}))`;}
  // D thai/tibetan
  {const o=PANELS.p3.o;let mi=0;
   o.th.forEach(g=>{const x=o.tx+g.g.x*o.k,y=o.by-g.g.y*o.k;if(!g.mark){setp(g.p,x,y,o.k,seg(tt,1.6,1.9));return}
     const st=1.95+mi*0.16;mi++;const d=seg(tt,st,st+.5);const yy=y+(g.below?1:-1)*(1-eback(d,2))*70;setp(g.p,x,yy,o.k,seg(d,0,.3),d<1?'#ffb27a':'#ffc89e')});
   const ap=seg(tt,1.7,2.0);o.tb.forEach(g=>{setp(g.p,o.bx+g.g.x*o.kb,o.by-g.g.y*o.kb,o.kb,ap,g.lig?'#ffc89e':'#f4f2ec')});
   o.cr.setAttribute('height',(eio3(seg(tt,2.1,3.0))*330).toFixed(1));}
}
function S7(t){
  const tt=t-34.0;
  const BANG=1.12;
  fx.save();fx.globalCompositeOperation='lighter';fx.textAlign='center';fx.textBaseline='middle';
  const buckets={};
  const add=(w,sz,ch,x,y,a,acc,rot)=>{if(a<=0.01||sz<3)return;sz=Math.round(sz);const k=w+'|'+sz;(buckets[k]=buckets[k]||[]).push([ch,x,y,a,acc,rot])};
  if(tt<BANG){
    for(const p of PART7){const ap=seg(tt,p.d*.25-.05,p.d*.25+.12);const q=ei3(seg(tt,p.d*.6,1.0+p.d*.1));const qq=C(q);
      const x=CX+p.x0*(1-qq),y=CY+p.y0*(1-qq);
      const q2=C(ei3(seg(tt-0.03,p.d*.6,1.0+p.d*.1)));const x2=CX+p.x0*(1-q2),y2=CY+p.y0*(1-q2);
      const sz=p.sz*(1-.8*qq);const a=ap*(.55+.45*qq)*(1-seg(tt,1.0,1.1));
      add(p.w,sz,p.ch,x,y,a,p.acc,0);if(qq>.2){add(p.w,sz,p.ch,L(x,x2,.5),L(y,y2,.5),a*.35,p.acc,0);add(p.w,sz,p.ch,x2,y2,a*.18,p.acc,0)}}
    const g=seg(tt,0.3,1.08);const gr=fx.createRadialGradient(CX,CY,0,CX,CY,60+300*(1-g));gr.addColorStop(0,`rgba(255,230,200,${.9*g})`);gr.addColorStop(1,'rgba(255,138,61,0)');fx.fillStyle=gr;fx.fillRect(0,0,W,H);
  }else{
    const d=tt-BANG,k=1.9,gy=d*.05;
    for(const p of PART7){const r=p.v*(1-Math.exp(-k*d))/k+d*30, r2=p.v*(1-Math.exp(-k*Math.max(0,d-.035)))/k+d*30;
      let v=[p.dx*r,p.dy*r,p.dz*r],v2=[p.dx*r2,p.dy*r2,p.dz*r2];v=rot(v,'y',gy);v2=rot(v2,'y',gy);
      const D=1300;if(v[2]>D*.85)continue;const s=D/(D-v[2]),s2=D/(D-v2[2]);
      const x=CX+v[0]*s,y=CY+v[1]*s,x2=CX+v2[0]*s2,y2=CY+v2[1]*s2;
      const tw=.75+.25*Math.sin(p.tw+d*3);
      const a=(d<.15?1:L(1,.24,eo3(seg(d,.15,2.6))))*tw*(1-seg(tt,6.0,6.5));
      const sz=p.sz*s*.9;
      add(p.w,sz,p.ch,x,y,a,p.acc);
      const sp=Math.hypot(x-x2,y-y2);if(sp>6){add(p.w,sz,p.ch,L(x,x2,.5),L(y,y2,.5),a*.35,p.acc);add(p.w,sz,p.ch,x2,y2,a*.16,p.acc)}}
    ring(fx,CX,CY,eox(seg(d,0,1.4))*1700,L(60,1,seg(d,0,1.2)),(1-seg(d,0,1.3)),'255,200,150',70);
    ring(fx,CX,CY,eox(seg(d,.08,1.6))*1250,L(16,1,seg(d,.08,1.3)),(1-seg(d,.08,1.5))*.75,ACC,40);
    const cg=Math.exp(-d*2.6);const gr=fx.createRadialGradient(CX,CY,0,CX,CY,700);gr.addColorStop(0,`rgba(255,225,190,${.85*cg})`);gr.addColorStop(1,'rgba(255,138,61,0)');fx.fillStyle=gr;fx.fillRect(0,0,W,H);
  }
  for(const key in buckets){const[w,sz]=key.split('|');fx.font=`${w} ${sz}px PFSF`;for(const[ch,x,y,a,acc]of buckets[key]){fx.fillStyle=acc?`rgba(255,150,80,${a.toFixed(3)})`:`rgba(250,246,238,${(a*.85).toFixed(3)})`;fx.fillText(ch,x,y)}}
  fx.restore();
  // flash
  const f=tt<BANG-0.04?0:tt<BANG?seg(tt,BANG-.04,BANG):Math.exp(-(tt-BANG)*6);
  $('flash').style.opacity=Math.max(+$('flash').style.opacity||0,C(f)).toFixed(3);
  // lockup
  place($('scrim7'),CX,CY+40,{o:eo3(seg(tt,1.5,2.6))});
  const A=$('l7a'),B=$('l7b'),Cc=$('l7c'),Dd=$('l7d'),ln=$('l7line');
  const pa=seg(tt,1.45,2.6);
  A.style.fontVariationSettings=fvs(L(100,800,eo3(pa)));A.style.letterSpacing=L(.3,.03,eo3(pa))+'em';
  A.style.textShadow=`0 0 ${40+60*(1-pa)}px rgba(${ACC},${.55-.2*pa}),0 0 140px rgba(${ACC},.22)`;
  place(A,CX,CY-120,{s:L(1.18,1,eo3(pa)),o:seg(tt,1.45,1.8),blur:(1-eo3(pa))*18});
  const pb=seg(tt,2.0,2.8);B.style.fontVariationSettings=fvs(300);B.style.letterSpacing=L(.6,.26,eo3(pb))+'em';B.style.color='#d8d5ce';
  place(B,CX,CY+40,{o:eo3(pb),blur:(1-eo3(pb))*8});
  const pc=seg(tt,2.6,3.3);Cc.style.fontVariationSettings=fvs(L(200,460,eo3(pc)));Cc.style.letterSpacing='.32em';Cc.style.color='#ffd2ad';Cc.style.textShadow=`0 0 24px rgba(${ACC},.5)`;
  place(Cc,CX+8,CY+150,{o:eo3(pc),blur:(1-eo3(pc))*8});
  place(ln,CX,CY+200,{o:seg(tt,2.9,3.4),sx:eo3(seg(tt,2.9,3.7)),s:1});
  const pd=seg(tt,3.3,3.9);place(Dd,CX,CY+252,{o:eo3(pd)*.95});Dd.style.fontVariationSettings=fvs(420);

// ---------- master ----------
const SC={s1:S1,s2:S2,s3:S3,s4:S4,s5:S5,s6:S6,s7:S7};
function render(t){
  drawBG(t);fx.clearRect(0,0,W,H);
  $('flash').style.opacity=0;$('fade').style.opacity=0;
  let shake=[0,0];
  for(const k in T){const[a,b]=T[k];const on=t>=a&&t<b;$(k).style.display=on?'block':'none';if(on){const r=SC[k](t);if(r)shake=r}}
  $('stage').style.transform=`translate(${shake[0].toFixed(2)}px,${shake[1].toFixed(2)}px)`;
  // captions
  const c=CAPS.find(c=>t>=c[0]&&t<c[1]);
  if(c){const [a,b,n,tag,z,e]=c;if($('capz').textContent!==z){$('capz').textContent=z;$('cape').textContent=e;$('lbl').innerHTML=`<b>${n}</b>${tag}`}
    const o=seg(t,a+.45,a+.95)*(1-seg(t,b-.4,b-.05));$('cap').style.opacity=o.toFixed(3);$('cap').style.transform=`translateY(${((1-eo3(seg(t,a+.45,a+1.1)))*14).toFixed(1)}px)`;
    $('lbl').style.opacity=(seg(t,a+.3,a+.8)*(1-seg(t,b-.4,b-.05))).toFixed(3);
  }else{$('cap').style.opacity=0;$('lbl').style.opacity=0}
}
window.render=render;window.DUR=DUR;
(async()=>{
  await document.fonts.load("500 50px PFSF","永");await document.fonts.ready;
  ['s2','s3','s4','s5','s6','s7'].forEach(k=>$(k).style.display='block');
  buildS2();buildS3();buildS4();buildS5();buildS6();buildParticles();
  render(0);window.READY=true;
})();
</script>
