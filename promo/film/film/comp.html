<!doctype html>
<html><head><meta charset="utf-8">
<!--
  PingFang SF · launch film. One seekable timeline; every frame is a pure function of t.
  120 BPM (bar = 2 s), 58.5 s, two cuts: comp.html?lang=en | ?lang=zh.  ?t=12.3 draws that moment (for stills).
  Every glyph on screen is the repo's own font file (fonts/PingFangSF.ttf = "PingFang-SF Medium.ttf" v1.2.0): live text
  in the browser, or outlines read from it (data/*.json, atlas/*.png via gen/*.py). No other typeface is loaded.
  The carry element is the tittle of the i in "PingFang": one blue dot, the only accent-coloured thing in the film.
  Contract: __ready, __meta, __seek(t), __motion(t0,t1), __events(), __handoff(), __copy.
-->
<style>
@font-face{font-family:"PFSF";src:url("fonts/PingFangSF.ttf") format("truetype");font-weight:100 900;font-stretch:80% 120%;font-display:block}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#111214;font-family:"PFSF";color:#F4F2EC;font-kerning:normal}
.abs{position:absolute;left:0;top:0}
.ln{position:absolute;left:0;top:0;white-space:pre;line-height:1}
.ln span{display:inline-block;white-space:pre}
#f3d,#lockA{position:absolute;left:0;top:0;width:1920px;height:1080px}
#carry{position:absolute;left:0;top:0;background:#8AB4FF;will-change:transform}
.cap{position:absolute;left:120px;white-space:nowrap;line-height:1}
.capH{font-size:46px;font-variation-settings:'wght' 600;letter-spacing:-0.3px}
.capS{font-size:26px;font-variation-settings:'wght' 450;color:#9C9A93;letter-spacing:0.2px}
html[lang=zh-Hans] .capH{letter-spacing:1px}
html[lang=zh-Hans] .capS{letter-spacing:1.5px}
.mask{position:absolute;left:0;overflow:hidden;width:1920px}
.hud{font-size:26px;font-variation-settings:'wght' 450;color:#9C9A93;font-variant-numeric:tabular-nums;letter-spacing:0.5px;white-space:pre}
.lbl{position:absolute;font-size:21px;font-variation-settings:'wght' 450;color:#8F8D86;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:0.4px}
#term{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#twin{position:absolute;left:340px;top:150px;width:1240px;height:720px;border-radius:18px;background:#1A1B1E;box-shadow:0 0 0 1px rgba(255,255,255,0.07),0 40px 120px rgba(0,0,0,0.5)}
#tbar{position:absolute;left:0;top:0;width:1240px;height:52px;border-bottom:1px solid rgba(255,255,255,0.06)}
#tbar i{position:absolute;top:19px;width:14px;height:14px;border-radius:7px;background:#3A3B3F}
#ttitle{position:absolute;left:0;width:1240px;top:16px;text-align:center;font-size:20px;color:#8F8D86;font-variation-settings:'wght' 500;line-height:1}
.tl{position:absolute;left:380px;font-size:26px;line-height:1;white-space:pre;font-variant-numeric:tabular-nums;font-variation-settings:'wght' 450}
.tl span{display:inline-block;white-space:pre}
.tl .pr{color:#8F8D86}
.tl.o{color:#C9C7C0}
.gr{position:absolute;left:0;top:0;white-space:nowrap;font-size:150px;line-height:1;font-variation-settings:'wght' 500}
.gl{position:absolute;left:0;top:0;white-space:nowrap;font-size:24px;line-height:1;font-variation-settings:'wght' 450;color:#8F8D86;letter-spacing:2px}
html[lang=zh-Hans] .gl{letter-spacing:3px}
.vc{position:absolute;left:0;top:0;font-size:80px;line-height:1;font-variation-settings:'wght' 500;white-space:pre}
.vv{writing-mode:vertical-rl}
#vtH{position:absolute;left:0;top:0;font-size:80px;line-height:1;white-space:pre;font-variation-settings:'wght' 500;opacity:0}
#vtV{position:absolute;left:0;top:0;font-size:80px;line-height:1;white-space:pre;font-variation-settings:'wght' 500;writing-mode:vertical-rl;opacity:0}
#vtH span,#vtV span{display:inline-block}
#fade{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;opacity:0}
#hud{position:absolute;right:16px;top:12px;font:16px monospace;color:#0f0;z-index:9}
</style>
<script src="mspring.js"></script>
</head><body>
<div id="stage">
  <img id="f3d" style="display:none">
  <!-- S2 thesis + S9 finale (typed lines) -->
  <div id="sT" class="abs"></div>
  <!-- S3/S4 specimen: drawn in screen space from the font's own points -->
  <svg id="sSpec" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="display:none">
    <defs><clipPath id="specClip"><rect id="specClipR" x="0" y="0" width="1920" height="1080"/></clipPath></defs>
    <g id="mLines"></g>
    <g clip-path="url(#specClip)"><path id="specFill" fill="#F4F2EC"/></g>
    <path id="specOut" fill="none" stroke="#F4F2EC" stroke-width="2" stroke-linejoin="round"/>
    <path id="specHdl" fill="none" stroke="#6B6A65" stroke-width="1.25"/>
    <path id="specOff" fill="#111214" stroke="#9C9A93" stroke-width="1.6"/>
    <path id="specOn" fill="#F4F2EC"/>
    <path id="specTit" fill="#8AB4FF"/>
  </svg>
  <div id="mLbl" class="abs"></div>
  <div id="axisHud" class="abs hud" style="display:none"></div>
  <!-- S5 scripts -->
  <div id="sG" class="abs" style="display:none"></div>
  <!-- S6 glyph grid -->
  <div id="sGrid" class="abs" style="display:none;width:1920px;height:1080px;overflow:hidden">
    <div id="gWorld" class="abs" style="transform-origin:0 0"></div>
    <div id="gLbl" class="abs"></div>
  </div>
  <!-- S7 vertical -->
  <div id="sV" class="abs" style="display:none"><div id="vtH"></div><div id="vtV"></div><div id="vChars" class="abs"></div></div>
  <!-- S8 terminal (real transcript: session/term_final.txt) -->
  <div id="sTerm" class="abs" style="display:none;width:1920px;height:1080px">
    <div id="term"><div id="twin"><div id="tbar"><i style="left:22px"></i><i style="left:46px"></i><i style="left:70px"></i><div id="ttitle"></div></div></div><div id="tlines" class="abs"></div></div>
  </div>
  <!-- S11 lockup: the wordmark as outlines from the font (w800 + w300), tittle in accent -->
  <svg id="lockV" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="display:none">
    <g id="lockG"><path id="lockP" fill="#F4F2EC"/></g><path id="lockT" fill="#8AB4FF"/>
  </svg>
  <div id="lockSub" class="abs" style="display:none"></div>
  <div id="carry"></div>
  <div id="caps" class="abs"></div>
  <div id="fade"></div>
  <div id="hud"></div>
</div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') === 'zh' ? 'zh' : 'en';
if (LANG === 'zh') document.documentElement.lang = 'zh-Hans';
const FPS = 30, BPM = 120, BAR = 2, BEAT = 0.5, DUR = 58.5;
const ACC = '#8AB4FF', PAPER = '#F4F2EC';

// ───────────────────────── copy (one language per cut; specimens, commands and output are data) ─────────────────────────
const COPY = {
  en: {
    th1: 'Chinese and Latin,', th2: 'set as one.',
    harmH: 'SF Pro Latin. PingFang Chinese.', harmS: 'One em square, one baseline, matched weights.',
    mEmTop: 'em top', mCap: 'cap height', mX: 'x-height', mBase: 'baseline', mEmBot: 'em bottom',
    varH: 'Variable, from 100 to 900.', varS: 'Weight and width axes. Every point moves.',
    scrH: '56,497 characters.', scrS: 'Latin, Greek, Cyrillic, Arabic, Indic, Southeast Asian, Hangul, Han — one file.',
    gH: '65,535 glyphs.', gS: 'Every slot TrueType allows, filled.', gLast: 'last glyph', gNone: 'no 65,536th slot',
    vH: 'Vertical, too.', vS: 'Punctuation turns with the line.',
    tTitle: 'Terminal', iH: 'Install once. Nine named weights.', iS: 'Found by its English or Chinese name.',
    fin: 'One font. Every script.',
    lic: 'v1.2.0 · For personal, non-commercial use',
  },
  zh: {
    th1: '中文与拉丁，', th2: '浑然一体',
    harmH: 'SF Pro 的拉丁，苹方的汉字', harmS: '同一个字身框，同一条基线，字重彼此匹配',
    mEmTop: '字身框顶', mCap: '大写高度', mX: '小写高度', mBase: '基线', mEmBot: '字身框底',
    varH: '从 100 到 900，连续可变', varS: '字重、字宽两个轴，每个点都在移动',
    scrH: '56,497 个字符', scrS: '拉丁、希腊、西里尔、阿拉伯、印度诸文、东南亚诸文、韩文、汉字，同在一个文件',
    gH: '65,535 个字形', gS: 'TrueType 允许的字形数，一个不剩', gLast: '最后一个字形', gNone: '没有第 65,536 格',
    vH: '竖排，同样从容', vS: '标点随行转向',
    tTitle: '终端', iH: '装一次，九个字重齐备', iS: '中文名、英文名，都能找到',
    fin: '一个字体，书写世界',
    lic: 'v1.2.0 · 仅供个人非商业学习研究',
  },
}[LANG];
window.__copy = COPY;

// ───────────────────────── helpers ─────────────────────────
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
const expoIn = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, 10 * x - 10));
const expoOut = (x) => (x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.pow(2, -10 * x));
const expoInOut = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
const { appleOut, appleInOut, whip } = MO;
const easeInC = (x) => x * x * x;
const SPC = {}; const sp = (vd, b) => (SPC[vd + ':' + b] ||= MO.spring(vd, b));
const r2 = (v) => Math.round(v * 100) / 100;
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const pending = [];
function setSrc(img, src) { if (img.getAttribute('src') !== src) { img.setAttribute('src', src); pending.push(img.decode().catch(() => {})); } }
function show(el, on) { el.style.display = on ? '' : 'none'; }
function op(el, v) { el.style.opacity = clamp(v).toFixed(3); }

// carry: exactly one section sets it per frame
let CAR = null;
function carry(x, y, w, h, r = 0.5, o = 1) { CAR = { x, y, w, h, r, o }; }
function drawCarry() {
  const el = $('carry');
  if (!CAR || CAR.o <= 0) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.style.width = r2(CAR.w) + 'px'; el.style.height = r2(CAR.h) + 'px';
  el.style.borderRadius = r2(Math.min(CAR.w, CAR.h) * CAR.r) + 'px';
  el.style.transform = `translate(${r2(CAR.x - CAR.w / 2)}px,${r2(CAR.y - CAR.h / 2)}px)`;
  el.style.opacity = CAR.o;
}
// field (2100×1240) ⇄ dot, log-space size, centre follows the size (the field closes ONTO the dot)
function fieldZoom(u, dot) {
  const F = { x: 960, y: 540, w: 2300, h: 1400 };
  const w = Math.exp(lerp(Math.log(F.w), Math.log(dot.w), u)), h = Math.exp(lerp(Math.log(F.h), Math.log(dot.h), u));
  const k = (Math.log(F.w) - Math.log(w)) / (Math.log(F.w) - Math.log(dot.w));
  return { x: lerp(F.x, dot.x, k), y: lerp(F.y, dot.y, k), w, h, r: lerp(0, 0.5, k) };
}

// ───────────────────────── captions ─────────────────────────
const CAPS = [];
function caption(id, t0, t1, head, sub) { CAPS.push({ id, t0, t1, head, sub }); }
function buildCaps() {
  const root = $('caps');
  for (const c of CAPS) {
    const mk = (cls, txt, base, size) => {
      const m = document.createElement('div'); m.className = 'mask'; m.style.top = (base - size * 1.05) + 'px'; m.style.height = (size * 1.4) + 'px';
      const d = document.createElement('div'); d.className = 'cap ' + cls; d.textContent = txt; d.style.top = (size * 0.05) + 'px';
      m.appendChild(d); root.appendChild(m); return { m, d };
    };
    c.h = mk('capH', c.head, 940, 46); c.s = c.sub ? mk('capS', c.sub, 988, 26) : null;
  }
}
function drawCaps(t) {
  for (const c of CAPS) {
    const on = t >= c.t0 - 0.01 && t < c.t1 + 0.3;
    show(c.h.m, on); if (c.s) show(c.s.m, on);
    if (!on) continue;
    [c.h, c.s].forEach((L, i) => {
      if (!L) return;
      const a = sp(0.5, 0)(t - c.t0 - i * 0.065), out = easeInC(seg(t, c.t1, c.t1 + 0.28));
      const y = Math.round((1 - a) * 64 + out * 26);
      L.d.style.transform = `translateY(${y}px)`; op(L.d, (1 - out));
    });
  }
}

// ───────────────────────── typed lines ─────────────────────────
const LINES = {};
function typedLine(id, text, size, wght, t0, dur, track) {
  const d = document.createElement('div'); d.className = 'ln'; d.style.fontSize = size + 'px';
  d.style.fontVariationSettings = `'wght' ${wght}`; if (track != null) d.style.letterSpacing = track + 'px';
  for (const ch of [...text]) { const s = document.createElement('span'); s.textContent = ch; d.appendChild(s); }
  $('sT').appendChild(d);
  LINES[id] = { el: d, text: [...text], size, t0, dur, spans: [...d.children], right: [], x: 0, base: 0 };
  return LINES[id];
}
function measureLine(L) { const r0 = L.el.getBoundingClientRect(); L.right = L.spans.map((s) => s.getBoundingClientRect().right - r0.left); L.width = L.right[L.right.length - 1]; }
function nTyped(L, t) { return Math.floor(clamp((t - L.t0) / L.dur) * L.text.length + 1e-6); }
function drawLine(L, t, dy = 0, o = 1) {
  const n = nTyped(L, t);
  L.spans.forEach((s, i) => { s.style.opacity = i < n ? 1 : 0; });
  L.el.style.transform = `translate(${Math.round(L.x)}px,${Math.round(L.base - L.size * 0.86 + dy)}px)`;   // line box top ≈ baseline − ascent
  op(L.el, o); show(L.el, true);
  return n;
}
function penAt(L, n) {   // the dot as the pen: tittle height, 0.08 em after the last glyph
  const s = L.size, x = L.x + (n > 0 ? L.right[n - 1] : 0) + s * 0.08 + s * 0.065;
  return { x, y: L.base - s * 0.685, w: s * 0.13, h: s * 0.13 };
}
const keyEvents = [];
function lineKeys(L, every) { const n = L.text.length; for (let i = 0; i < n; i++) if (L.text[i] !== ' ' && (i % every === 0)) keyEvents.push({ t: L.t0 + (i + 0.5) * L.dur / n, kind: 'key' }); }

// ───────────────────────── data ─────────────────────────
let SPEC, LOCK, GREET, TERM;
const SPEC_S = 0.3, SPEC_BASE = 640;      // specimen at 300 px/em, baseline y

// ───────────────────────── timeline constants (120 BPM; bars on the left) ─────────────────────────
const T = {
  open: [0, 6],                 // bars 0–3   3D open
  thesis: [6, 10],              // bars 3–5
  spec: [10, 22],               // bars 5–11  harmony → anatomy → variable
  scr: [22, 30],                // bars 11–15 every script
  grid: [30, 36],               // bars 15–18 65,535
  vert: [36, 40],               // bars 18–20 vertical
  term: [40, 46],               // bars 20–23 install
  fin: [46, 50],                // bars 23–25 finale
  end3d: [50, 52.5],            // bars 25–26.25 3D reprise
  lock: [52.5, 58.5],           // lockup
};

// thesis lines
const TH_SIZE = 112;
let th1, th2, fin;
function buildType() {
  th1 = typedLine('th1', COPY.th1, TH_SIZE, 600, 6.6, 1.0, LANG === 'zh' ? 1 : -1.5);
  th2 = typedLine('th2', COPY.th2, TH_SIZE, 600, 8.0, 0.9, LANG === 'zh' ? 1 : -1.5);
  fin = typedLine('fin', COPY.fin, 120, 600, 46.15, 1.0, LANG === 'zh' ? 1 : -1.5);
}
function layoutType() {
  [th1, th2, fin].forEach(measureLine);
  const mw = Math.max(th1.width, th2.width), x0 = Math.round((1920 - mw) / 2);
  const lh = LANG === 'zh' ? 1.32 : 1.18;
  th1.x = x0; th2.x = x0; th1.base = Math.round(540 - TH_SIZE * lh / 2 + TH_SIZE * 0.36); th2.base = Math.round(th1.base + TH_SIZE * lh);
  fin.x = Math.round((1920 - fin.width) / 2); fin.base = 580;
  lineKeys(th1, LANG === 'zh' ? 1 : 2); lineKeys(th2, LANG === 'zh' ? 1 : 2); lineKeys(fin, LANG === 'zh' ? 1 : 2);
}

// ── S2 thesis 6–10 ──
function drawThesis(t) {
  const on = t >= 6 && t < 10.05; show($('sT'), on || (t >= 46 && t < 49.6));
  if (!on) { show(th1.el, false); show(th2.el, false); return; }
  const out = easeInC(seg(t, 9.55, 9.9));
  const n1 = drawLine(th1, t, -out * 40, 1 - out), n2 = drawLine(th2, t, -out * 40, 1 - out);
  // the carry
  const p1s = penAt(th1, 0), p1 = penAt(th1, n1), p2s = penAt(th2, 0), p2 = penAt(th2, n2);
  let c;
  if (t < 6.55) { const f = fieldZoom(expoOut(seg(t, 6.0, 6.5)), p1s); carry(f.x, f.y, f.w, f.h, f.r); return; }
  if (t < 7.6) c = p1;
  else if (t < 8.0) { const u = appleInOut(seg(t, 7.62, 7.98)), a = penAt(th1, th1.text.length); c = { ...a, x: lerp(a.x, p2s.x, u), y: lerp(a.y, p2s.y, u) }; }
  else c = p2;
  if (t >= 9.55) {                       // glide onto the i of the specimen
    const tgt = specTittleScreen(10.0), u = whip(seg(t, 9.55, 10.0));
    c = { x: lerp(c.x, tgt.x, u), y: lerp(c.y, tgt.y, u), w: lerp(c.w, tgt.w, u), h: lerp(c.h, tgt.h, u) };
  }
  carry(c.x, c.y, c.w, c.h, 0.5);
}

// ───────────────────────── S3/S4 specimen 10–22 ─────────────────────────
function specWeight(t) { return t < 16.4 ? 500 : t < 17.0 ? lerp(500, 100, appleInOut(seg(t, 16.4, 17.0))) : t < 18.6 ? lerp(100, 900, appleInOut(seg(t, 17.05, 18.6))) : lerp(900, 500, appleInOut(seg(t, 18.65, 19.2))); }
function specWidth(t) { return t < 19.3 ? 100 : t < 19.9 ? lerp(100, 80, appleInOut(seg(t, 19.3, 19.9))) : t < 20.7 ? lerp(80, 120, appleInOut(seg(t, 19.95, 20.7))) : lerp(120, 100, appleInOut(seg(t, 20.75, 21.15))); }
function specAt(t) {                   // interpolated glyph points at (wght, wdth); structure is identical in every sample
  const w = specWeight(t), d = specWidth(t);
  let arr, k;
  if (Math.abs(d - 100) > 1e-6) { arr = SPEC.wdth; k = (d - 80) / 5; } else { arr = SPEC.wght; k = (w - 100) / 50; }
  k = clamp(k, 0, arr.length - 1.000001); const i = Math.floor(k), f = k - i, A = arr[i], B = arr[i + 1];
  const adv = lerp(A.adv, B.adv, f);
  const g = A.g.map((ga, gi) => { const gb = B.g[gi]; return { ch: ga.ch, tit: ga.tit, x: lerp(ga.x, gb.x, f), c: ga.c.map((ca, ci) => ca.map((p, pi) => { const q = gb.c[ci][pi]; return [lerp(p[0], q[0], f), lerp(p[1], q[1], f), p[2]]; })) }; });
  return { adv, g, w, d };
}
// camera for the specimen world (world px; specimen centred at x 960 at weight 500)
const SPK = [];
function K(arr, t, f, s, z, e) { arr.push({ t, f, s, z, e: e || ((u) => u) }); }
function camAt(arr, t) {
  if (t <= arr[0].t) return arr[0];
  for (let i = 1; i < arr.length; i++) {
    const a = arr[i - 1], b = arr[i];
    if (t <= b.t) { const u = b.e(seg(t, a.t, b.t)); return { f: lerp2(a.f, b.f, u), s: lerp2(a.s, b.s, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) }; }
  }
  return arr[arr.length - 1];
}
const toS = (c, p) => [c.s[0] + (p[0] - c.f[0]) * c.z, c.s[1] + (p[1] - c.f[1]) * c.z];
let TIT_W;                              // tittle centre in world px at weight 500
function specWorld(pt, x0) { return [x0 + pt[0] * SPEC_S, SPEC_BASE - pt[1] * SPEC_S]; }
function specX0(adv) { return 960 - adv * SPEC_S / 2; }
function tittleBox(S, cam) {
  const g = S.g.find((q) => q.tit >= 0); const c = g.c[g.tit]; const x0 = specX0(S.adv);
  let a = [1e9, 1e9], b = [-1e9, -1e9];
  for (const p of c) { const s = toS(cam, specWorld([p[0] + g.x, p[1]], x0)); a = [Math.min(a[0], s[0]), Math.min(a[1], s[1])]; b = [Math.max(b[0], s[0]), Math.max(b[1], s[1])]; }
  return { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2, w: b[0] - a[0], h: b[1] - a[1] };
}
function specTittleScreen(t) { return tittleBox(specAt(t), camAt(SPK, t)); }
function buildSpecCam() {

    op(c.a, (i < n ? 1 : 0) * (1 - xf) * (1 - out));
    if (c.b) { c.b.style.transform = `translate(${r2(-c.bw / 2)}px,${r2(-c.bh / 2)}px)`; op(c.b, (i < n ? 1 : 0) * xf * (1 - out)); }
  });
  if (t < 39.45) { const d = vertDot(t); carry(d.x, d.y, d.w, d.h, 0.5); }
  else { const d = vertDot(39.45), p = termCaret(40.0), u = whip(seg(t, 39.45, 40.0)); carry(lerp(d.x, p.x, u), lerp(d.y, p.y, u), lerp(d.w, 14, u), lerp(d.h, 14, u), lerp(0.5, 0.2, u)); }
}

// ───────────────────────── S8 terminal 40–46 (real session) ─────────────────────────
const TL_X = 380, TL_B0 = 262, TL_LH = 38;
let TROWS = [];   // {el, kind:'cmd'|'out', t0, dur, spans, right}
const TPLAN = [[40.5, 0.8], [41.55, 0.4], [42.15, 0.7], [43.75, 0.55]];
function buildTerm() {
  $('ttitle').textContent = COPY.tTitle;
  const root = $('tlines'); let ci = 0, oi = 0, outT = 0, row = 0;
  for (const line of TERM) {
    const d = document.createElement('div'); d.className = 'tl'; root.appendChild(d);
    if (line.startsWith('$ ')) {
      const pr = document.createElement('span'); pr.className = 'pr'; pr.textContent = '$ '; d.appendChild(pr);
      for (const ch of [...line.slice(2)]) { const s = document.createElement('span'); s.textContent = ch; d.appendChild(s); }
      const [t0, dur] = TPLAN[ci++]; TROWS.push({ el: d, kind: 'cmd', t0, dur, row, n: [...line.slice(2)].length }); outT = t0 + dur + 0.15; oi = 0;
    } else {
      d.classList.add('o'); d.textContent = line || ' ';
      TROWS.push({ el: d, kind: 'out', t0: outT + oi * 0.0625, row }); oi++;
    }
    row++;
  }
  const last = document.createElement('div'); last.className = 'tl'; last.innerHTML = '<span class="pr">$ </span>'; root.appendChild(last);
  TROWS.push({ el: last, kind: 'prompt', t0: 44.55, row });
}
function layoutTerm() {
  TROWS.forEach((r) => {
    r.el.style.top = (TL_B0 + r.row * TL_LH - 26 * 0.86) + 'px';
    const r0 = r.el.getBoundingClientRect(); r.right = [...r.el.children].map((s) => s.getBoundingClientRect().right - r0.left);
  });
}
const TCAM = [];
function buildTermCam() { const C = [960, 540]; K(TCAM, 40.0, C, C, 1); K(TCAM, 44.45, C, C, 1); K(TCAM, 45.05, [960, 740], [960, 600], 1.22, sp(0.55, 0.14)); K(TCAM, 46.0, [960, 740], [960, 600], 1.23); }
function termCaret(t) {        // block cursor, in un-cammed screen px
  let row = 0, x = TL_X;
  const cmds = TROWS.filter((r) => r.kind !== 'out');
  for (const r of TROWS) {
    if (r.kind === 'cmd' && t >= r.t0 - 0.3) { const n = Math.floor(clamp((t - r.t0) / r.dur) * r.n + 1e-6); row = r.row; x = TL_X + r.right[n]; if (t >= r.t0 + r.dur + 0.08) { row = r.row + 1; x = TL_X; } }
    if (r.kind === 'out' && t >= r.t0) { row = r.row + 1; x = TL_X; }
    if (r.kind === 'prompt' && t >= r.t0) { row = r.row; x = TL_X + r.right[0]; }
  }
  if (t < 40.5) { const r = TROWS[0]; row = r.row; x = TL_X + r.right[0]; }
  return { x: x + 8, y: TL_B0 + row * TL_LH - 9, w: 14, h: 30 };
}
function drawTerm(t) {
  const on = t >= 40.0 && t < 46.1; show($('sTerm'), on); if (!on) return;
  const cam = camAt(TCAM, t);
  const ex = appleInOut(seg(t, 45.55, 45.95));
  const z = cam.z * (1 - 0.06 * ex);
  $('term').style.transform = `translate(${cam.s[0]}px,${cam.s[1]}px) scale(${z}) translate(${-cam.f[0]}px,${-cam.f[1]}px)`;
  op($('term'), 1 - ex);
  const p0 = termCaret(40.0), u = expoOut(seg(t, 40.0, 40.45));
  // the window opens out of the cursor
  const L = lerp(p0.x - 340, 0, u), Tt = lerp(p0.y - 150, 0, u), R = lerp(1580 - p0.x, 0, u), B = lerp(870 - p0.y, 0, u);
  $('twin').style.clipPath = `inset(${Tt}px ${R}px ${B}px ${L}px round 18px)`;
  op($('tlines'), seg(t, 40.25, 40.45));
  TROWS.forEach((r) => {
    if (r.kind === 'cmd') { const n = Math.floor(clamp((t - r.t0) / r.dur) * r.n + 1e-6); [...r.el.children].forEach((s, i) => { s.style.opacity = i === 0 ? 1 : (i <= n ? 1 : 0); }); op(r.el, t >= r.t0 - 0.3 || r === TROWS[0] ? 1 : 0); }
    else op(r.el, t >= r.t0 ? 1 : 0);
  });
  const c = termCaret(t); const s = toS(cam, [c.x + 7, c.y]);
  const sw = s[0] - (s[0] - 960) * 0.06 * ex, sh = s[1] - (s[1] - 540) * 0.06 * ex;
  if (t < 40.45) { const k = expoOut(seg(t, 40.0, 40.4)); carry(s[0], s[1], 14, lerp(14, 30, k), lerp(0.5, 0.18, k)); }
  else if (t < 45.55) carry(s[0], s[1], 14 * z, 30 * z, 0.18);
  else { const p = penAt(fin, 0), u2 = whip(seg(t, 45.55, 46.1)); carry(lerp(sw, p.x, u2), lerp(sh, p.y, u2), lerp(14 * z, p.w, u2), lerp(30 * z, p.h, u2), lerp(0.18, 0.5, u2)); }
}

// ───────────────────────── S9 finale 46–50 ─────────────────────────
function drawFin(t) {
  const on = t >= 46.0 && t < 50.0; if (!on) { show(fin.el, false); return; }
  show($('sT'), true);
  const o = 1 - seg(t, 48.85, 49.2);
  const n = drawLine(fin, t, 0, o);
  if (t < 46.1) return;                  // the terminal still owns the carry
  const p = penAt(fin, n);
  if (t < 48.85) { carry(p.x, p.y, p.w, p.h, 0.5); return; }
  const f = fieldZoom(1 - expoIn(seg(t, 48.85, 49.6)), p); carry(f.x, f.y, f.w, f.h, f.r);
}

// ───────────────────────── 3D frames + lockup ─────────────────────────
const LK = { ppu: 0.132, sx: 960, sy: 520, W1: 800, W2: 300, OY: 352 };
function buildLock() {
  const s1 = LOCK.samples[(LK.W1 - 100) / 25], s2 = LOCK.samples[(LK.W2 - 100) / 25];
  const TW = s1.adv1 + s2.space + s2.adv2; LK.TW = TW;
  const shift = (d, dx) => { let k = 0; return d.replace(/-?\d+\.?\d*/g, (v) => (k++ % 2 === 0 ? (+v + dx).toFixed(1) : v)); };
  let d = s1.run1.map((g) => g.d).join('');
  d += s2.run2.map((g) => shift(g.d, s1.adv1 + s2.space)).join('');
  const tf = `translate(${LK.sx - TW / 2 * LK.ppu} ${LK.sy + LK.OY * LK.ppu}) scale(${LK.ppu} ${-LK.ppu})`;
  $('lockP').setAttribute('d', d); $('lockG').setAttribute('transform', tf);
  $('lockT').setAttribute('d', shift(s2.tittle, s1.adv1 + s2.space)); $('lockT').setAttribute('transform', tf);
  LK.tf = tf;
  const sub = $('lockSub');
  const u = document.createElement('div'); u.textContent = 'github.com/Juwan-Hwang/PingFang-SF';
  Object.assign(u.style, { position: 'absolute', left: '0', width: '1920px', textAlign: 'center', top: (650 - 28 * 0.86) + 'px', fontSize: '28px', lineHeight: '1', fontVariationSettings: "'wght' 450", color: '#D9D7D0', letterSpacing: '0.3px' });
  const l = document.createElement('div'); l.textContent = COPY.lic;
  Object.assign(l.style, { position: 'absolute', left: '0', width: '1920px', textAlign: 'center', top: (698 - 22 * 0.86) + 'px', fontSize: '22px', lineHeight: '1', fontVariationSettings: "'wght' 450", color: '#8F8D86', letterSpacing: LANG === 'zh' ? '2px' : '0.4px' });
  sub.appendChild(u); sub.appendChild(l); LK.u = u; LK.l = l;
}
window.__handoff = () => ({ ppu: LK.ppu, sx: LK.sx, sy: LK.sy });
function draw3D(t) {
  const img = $('f3d');
  if (t < 6.0) { show(img, true); setSrc(img, `frames/open/${String(Math.min(179, Math.floor(t * FPS + 1e-6))).padStart(4, '0')}.jpg`); op(img, 1); return; }
  if (t >= 50.0 && t < 52.5 + 1e-6) { show(img, true); setSrc(img, `frames/end/${String(Math.min(74, Math.floor((t - 50) * FPS + 1e-6))).padStart(4, '0')}.jpg`); op(img, 1); return; }
  show(img, false);
}
function drawLock(t) {
  const on = t >= 52.25; show($('lockV'), on); show($('lockSub'), on); if (!on) return;
  op($('lockV'), seg(t, 52.25, 52.5));
  // the tittle's sign-off: one hop, then home
  const h = t < 53.0 ? 0 : t < 53.17 ? expoOut(seg(t, 53.0, 53.17)) : 1 - sp(0.42, 0.35)(t - 53.17);
  $('lockT').setAttribute('transform', `translate(0 ${(-26 * h).toFixed(2)}) ` + LK.tf);
  const a = appleOut(seg(t, 53.55, 54.25)), b = appleOut(seg(t, 53.75, 54.45));
  LK.u.style.transform = `translateY(${Math.round(16 * (1 - a))}px)`; op(LK.u, a);
  LK.l.style.transform = `translateY(${Math.round(16 * (1 - b))}px)`; op(LK.l, b);
}

// ───────────────────────── seek ─────────────────────────
window.__meta = { dur: DUR, fps: FPS, bpm: BPM };
window.__seek = async (t) => {
  CAR = null;
  draw3D(t); drawThesis(t); drawSpec(t); drawGreet(t); drawGrid(t); drawVert(t); drawTerm(t); drawFin(t); drawLock(t);
  drawCaps(t); drawCarry();
  op($('fade'), seg(t, DUR - 0.7, DUR - 0.05));
  if (Q.has('hud')) $('hud').textContent = t.toFixed(3);
  const p = pending.splice(0); await Promise.all(p); return true;
};
// screen-space travel of the camera / carry across [t0, t1] (the renderer's motion-blur budget)
function probePts(t) {
  const pts = [];
  if (CAR) pts.push([CAR.x, CAR.y], [CAR.x + CAR.w / 2, CAR.y + CAR.h / 2]);
  const add = (arr, w0) => { const c = camAt(arr, t); for (const p of w0) pts.push(toS(c, p)); };
  if (t >= 10 && t < 22) { const c0 = camAt(SPK, t); add(SPK, [[300, 300], [1620, 780], TIT_W]); }
  if (t >= 30 && t < 36) add(GK, [HAO, LAST, [4096, 4096]]);
  if (t >= 40 && t < 46) add(TCAM, [[400, 300], [1500, 800]]);
  if (t >= 22 && t < 30) { const c = grCam(t); pts.push(toS(c, [GR_X, GR_BASE - GR_GAP]), toS(c, [1500, 900])); const u = grU(t); pts.push([0, u * GR_GAP]); }
  if (t >= 36.9 && t < 38.2) { const u = appleInOut(seg(t, 37.0, 37.9)); pts.push([lerp(VH[0].x, VV[0].x, u), lerp(VH[0].y, VV[0].y, u)], [lerp(VH[10].x, VV[10].x, u), lerp(VH[10].y, VV[10].y, u)]); }
  return pts;
}
window.__motion = (t0, t1) => {
  // carries are evaluated by drawing; cheap enough at 5 samples
  const samples = [];
  for (let k = 0; k <= 4; k++) { const t = lerp(t0, t1, k / 4); CAR = null; drawThesis(t); drawSpec(t); drawGreet(t); drawGrid(t); drawVert(t); drawTerm(t); drawFin(t); samples.push(probePts(t)); }
  let m = 0;
  for (let k = 1; k < samples.length; k++) { const a = samples[k - 1], b = samples[k]; for (let i = 0; i < Math.min(a.length, b.length); i++) m = Math.max(m, Math.hypot(b[i][0] - a[i][0], b[i][1] - a[i][1])); }
  return m * 4 > 4000 ? 4000 : m * 4 / 1;   // per-step travel × steps ≈ travel over the shutter
};

// ───────────────────────── events (sound is generated from the same tables) ─────────────────────────
window.__events = () => {
  const E = [];
  const hit = (t, extra = {}) => E.push({ t, kind: 'hit', ...extra });
  [2.0, 6.0, 10.0, 16.0, 22.0, 30.0, 36.0, 40.0, 46.0].forEach((t) => hit(t));
  hit(50.0, { big: true });
  E.push({ t: 52.5, kind: 'land' });
  [[9.55, 'carry'], [14.5, 'dive'], [21.3, 'carry'], [29.15, 'dive'], [35.6, 'carry'], [39.45, 'carry'], [45.55, 'carry'], [48.85, 'swell']].forEach(([t, k]) => E.push({ t, kind: k }));
  [[6.0, 'close'], [16.4, 'morph'], [19.3, 'morph'], [30.0, 'pull'], [34.0, 'whip'], [37.0, 'flow'], [13.0, 'push'], [44.45, 'push']].forEach(([t, k]) => E.push({ t, kind: k }));
  for (let i = 0; i < 5; i++) E.push({ t: 10.35 + i * 0.1, kind: 'tick', pan: -0.4 + i * 0.2 });
  for (let k = 1; k < GREET.length; k++) E.push({ t: grStepT(k), kind: 'tap', k });
  E.push(...keyEvents);
  const vn = [...VT].length; for (let i = 0; i < vn; i++) E.push({ t: 36.05 + (i + 0.5) * 0.7 / vn, kind: 'key' });
  TROWS.forEach((r) => {
    if (r.kind === 'cmd') { for (let i = 0; i < r.n; i += 2) E.push({ t: r.t0 + (i + 0.5) * r.dur / r.n, kind: 'tkey' }); E.push({ t: r.t0 + r.dur + 0.08, kind: 'enter' }); }
    if (r.kind === 'out') E.push({ t: r.t0, kind: 'out' });
  });
  E.push({ t: 40.0, kind: 'open' }, { t: 53.0, kind: 'pop' }, { t: 53.55, kind: 'rise' });
  return E.sort((a, b) => a.t - b.t);
};

// ───────────────────────── build + ready ─────────────────────────
caption('harm', 11.0, 14.45, COPY.harmH, COPY.harmS);
caption('var', 16.45, 21.2, COPY.varH, COPY.varS);
caption('scr', 23.0, 29.1, COPY.scrH, COPY.scrS);
caption('grid', 32.4, 35.55, COPY.gH, COPY.gS);
caption('vert', 37.3, 39.45, COPY.vH, COPY.vS);
caption('inst', 41.0, 45.5, COPY.iH, COPY.iS);
window.__ready = (async () => {
  [SPEC, LOCK, GREET] = await Promise.all(['data/spec.json', 'data/lockup.json', 'data/greet.json'].map((u) => fetch(u).then((r) => r.json())));
  TERM = (await (await fetch('data/term.txt')).text()).replace(/\n+$/, '').split('\n');
  GREET = [...GREET.filter((g) => g.s !== '你好'), GREET.find((g) => g.s === '你好')];   // end on 你好: the dive goes into 好
  buildType(); buildMetrics(); buildGreet(); buildGrid(); buildVert(); buildTerm(); buildLock(); buildCaps();
  for (const w of [100, 300, 450, 500, 600, 800, 900]) await document.fonts.load(`${w} 40px "PFSF"`);
  await document.fonts.load('500 40px "PFSF"', '你好苹方SF');
  await document.fonts.ready;
  show($('sV'), true); show($('sTerm'), true);
  layoutType(); layoutVert(); layoutTerm(); buildSpecCam(); buildTermCam();
  show($('sV'), false); show($('sTerm'), false);
  // 好's centre in the greeting reel at rest (last row, current)
  { const r = grRows[grRows.length - 1].d; r.style.transform = 'none'; show($('sG'), true); show(r, true); const b = r.getBoundingClientRect(); show($('sG'), false);
    const w2 = r.firstChild; const range = document.createRange(); range.setStart(w2, 1); range.setEnd(w2, 2); const rb = range.getBoundingClientRect();
    haoBox = { x: GR_X + (rb.left - b.left) + rb.width / 2, y: GR_BASE - 150 * 0.86 + (rb.top - b.top) + rb.height / 2 }; }
  await window.__seek(+(Q.get('t') || 0));
  return true;
})();
